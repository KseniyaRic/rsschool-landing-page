<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

        <div class="container header-container">
            <a href="index.html" class="logo">
                <img src="logo.svg" alt="Coffee House Logo">
            </a>
            <nav class="main-nav" id="mainNav">

                    <li class="menu-name">

                    </li>
                    <li class="menu-name">
                        <a class="menu-link" href="index.html#mobile-app">
                            Mobile app
                        </a>
                    </li>
                    <li class="menu-name">
                        <a class="menu-link" href="index.html#contact-us">
                            Contact us
                        </a>
                    </li>
                    <li class="menu-name menu-name-mobile">
                        <a class="menu-link menu-and-cup" href="menu.html">Menu

                    </li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="button-switch" aria-label="theme-switch">
                    <img src="Light.svg" alt="light-version">
                    <img src="Moon.svg" alt="dark-version">
                </button>
                <div class="menu-item">
                    <a class="menu-link menu-and-cup-end" href="menu.html">Menu

                    <button class="burger-button" aria-label="Open menu">
                        <span class="burger-line"></span>
                        <span class="burger-line"></span>
                    </button>
                </div>
            </div>
    </header>
    <main>
        <section id="menu-hero-container">
            <h1>Behind each of our cups<br>
                hides an <span>amazing surprise</span></h1>
            <div class="tabs" aria-label="menu-cathegory">
                <button class="tab is-active" data-category="coffee">
                    <span class="tab-icon-wrapper">
                        <img src="em_coffee.svg" alt="">
                    </span>
                    <span class="tab-text">Coffee</span>
                </button>
                <button class="tab" data-category="tea">
                    <span class="tab-icon-wrapper">
                        <img src="teapot.svg" alt="">
                    </span>
                    <span class="tab-text">Tea</span>
                </button>
                <button class="tab" data-category="dessert">
                    <span class="tab-icon-wrapper">
                        <img src="cake.svg" alt="">
                    </span>
                    <span class="tab-text">Dessert</span>
                </button>
            </div>
        </section>
        <div class="menu-section" id="menu">
            <div class="container">
                <div class="products-grid coffee-grid" data-category="coffee"></div>
                <div class="products-grid tea-grid" data-category="tea"></div>
                <div class="products-grid dessert-grid" data-category="dessert"></div>
            </div>
            <div class="refresh">
                <button id="load-more-btn" class="refresh-btn is-hidden">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M21.8883 13.5C21.1645 18.3113 17.013 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C16.1006 2 19.6248 4.46819 21.1679 8"
                            stroke="#403F3D" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M17 8H21.4C21.7314 8 22 7.73137 22 7.4V3" stroke="#403F3D" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </div>
    </main>
    <footer id="contact-us">
        <div class="container footer-container">
            <div class="footer-left">
                <p class="footer-heading">Sip, Savor, Smile.<span>It’s coffee time!</span></p>
                <div class="social-media">
                    <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
                        <img src="instagram.svg" alt="instagram"> </a>
                    <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">
                        <img src="facebook.svg" alt="facebook"></a>
                    <a href="https://x.com/" target="_blank" rel="noopener noreferrer">
                        <img src="twitter.svg" alt="twitter"></a>
                </div>
            </div>
            <div class="footer-right">
                <p class="footer-right-name">Contact us</p>
                <ul class="contacts-list">
                    <li><a href="tel:+1(603)5550123">
                            <img src="phone.svg" alt="phone">+1 (603) 555-0123</a></li>
                    <li><a href="https://www.google.com/maps/search/8558+Green+Rd.,++LA/@48.5033352,-122.3374381,17z/data=!3m1!4b1?entry=ttu&g_ep=EgoyMDI2MDkxNi4wIKXMDSoASAFQAw%3D%3D"
                            class="map" target="_blank" rel="noopener noreferrer">
                            <img src="pin-alt.svg" alt="location">8558 Green Rd., LA</a></li>
                    <li>
                        <p><img src="clock.svg" alt="clock">Mon–Sat: 9:00–23:00</p>
                    </li>
                </ul>
            </div>
        </div>
    </footer>
    <div class="modal" id="product-modal" hidden>
        <div class="modal-overlay" data-close></div>
        <div class="modal-window" id="modal-window"></div>
    </div>
    <script src="products.js"></script>
    <script src="script.js"></script>
</body>

</html>
